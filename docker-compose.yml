# Local MySQL for development. It reads the same variables as the backend:
#   docker compose --env-file backend/bar-raw-materials/.env up -d
# DB_USERNAME must not be "root" (the MySQL image creates it as a regular user).
name: bar-raw-materials

services:
  mysql:
    image: mysql:8.4
    container_name: bar-raw-materials-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bar_materials_db}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in the .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the .env file}
    ports:
      # change DB_PORT (and the port in DB_URL) if 3306 is already in use
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
