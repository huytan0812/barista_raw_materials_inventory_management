spring.application.name=bar-raw-materials
# Load a local .env file (KEY=value lines) if present; real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bar_materials_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.liquibase.enabled=false
spring.jpa.properties.hibernate.jdbc.batch_size=15
#server.servlet.context-path=/api

# Base64-encoded HMAC key, at least 32 bytes (256 bits) once decoded, required by HS256.
# Generate one with: openssl rand -base64 32
application.security.jwt.secret-key=${JWT_SECRET_KEY:}
# access token exp: 1 hour
application.security.jwt.expiration=3600000
# refresh token exp: 7 days
application.security.jwt.refresh-token.expiration=604800000

# Comma-separated list of origins allowed to call the API (the frontend dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Directory where uploaded images are stored and served from /api/image/**
image.path=${IMAGE_PATH:./images/}

# API endpoints group
apiStaff=/staff
