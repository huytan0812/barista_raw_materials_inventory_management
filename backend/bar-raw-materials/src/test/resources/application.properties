# Test configuration: replaces src/main/resources/application.properties on the test classpath.
# Uses an in-memory H2 database in MySQL mode with the schema generated from the entities,
# so tests need neither a running MySQL server nor a .env file.
spring.application.name=bar-raw-materials-test

spring.datasource.url=jdbc:h2:mem:bar_materials_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.liquibase.enabled=false

# Test-only key (Base64 of 32 ASCII bytes), not used anywhere else
application.security.jwt.secret-key=dGVzdC1vbmx5LWp3dC1rZXktZm9yLXVuaXQtdGVzdHM=
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=604800000

app.cors.allowed-origins=http://localhost:5173
image.path=./target/test-images/
apiStaff=/staff
